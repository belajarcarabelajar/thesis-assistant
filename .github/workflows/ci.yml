name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Manifests, licenses, skill frontmatter
        run: uv run --with pyyaml python scripts/validate.py

      - name: Python scripts compile
        run: python3 -m py_compile plugins/*/skills/*/scripts/*.py

      - name: Build and check the sample defense deck
        run: |
          scripts_dir=plugins/asisten-tesis/skills/defense-deck/scripts
          uv run --with python-pptx python "$scripts_dir/build_pptx.py" examples/defense-deck-sample/slides.json "$RUNNER_TEMP/deck.pptx" --script "$RUNNER_TEMP/script.md"
          uv run --with python-pptx python "$scripts_dir/check_pptx.py" "$RUNNER_TEMP/deck.pptx"
